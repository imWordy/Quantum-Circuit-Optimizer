[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qco"
version = "0.1.0"
description = "GNN-Guided Iterative Optimization of Small Quantum Circuits"
authors = [{ name = "DL Project Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
